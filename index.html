<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PiCS</title>

  <!-- lock iPad so no weird scrolling or pinching -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='4' fill='%2322c55e'/></svg>">

  <!-- jsPsych 8 -->
  <script src="https://unpkg.com/jspsych@8"></script>
  <link  href="https://unpkg.com/jspsych@8/css/jspsych.css" rel="stylesheet">
  <script src="https://unpkg.com/@jspsych/plugin-preload@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@2"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.6"></script>

  <!-- CSV reading -->
  <script src="https://unpkg.com/papaparse@5/papaparse.min.js"></script>

  <style>

  :root {
    color-scheme: light;
    --white:    #ffffff;
    --ink:      #15181d;
    --muted:    #6b7280;
    --line:     #e3e3e0;
    --surface:  #f4f4f5;
    --go:       #22c55e;
    --go-deep:  #15803d;
    --go-glow:  rgba(34, 197, 94, 0.35);
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    background: var(--white);
    overscroll-behavior: none;
  }

  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    box-sizing: border-box;
  }
  input { -webkit-user-select: text; user-select: text; }

  .jspsych-display-element {
    position: fixed;
    inset: 0;
    height: 100%;
    width: 100%;
    overflow: auto;
    background: var(--white);
    color: var(--ink);
    font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  }

  .jspsych-content-wrapper { height: 100%; }
  .jspsych-content {
    max-width: 100%;
    width: 100%;
    padding: 4vh 4vw;
  }

  .researcher, .child { background: var(--white); color: var(--ink); }

  .rsrch-kicker {
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .rsrch-title {
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -0.02em;
    margin: 0 0 28px;
  }

  .rsrch-note {
    color: var(--muted);
    font-size: 15px;
    margin: 14px 0 0;
  }

  .field { text-align: left; max-width: 360px; margin: 0 auto; }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    font-size: 22px;
    font-variant-numeric: tabular-nums;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
  }
  .field input:focus {
    outline: 2px solid var(--go);
    outline-offset: 2px;
  }

  .id-readout {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    padding: 18px 24px;
    border: 1px dashed var(--line);
    border-radius: 12px;
    display: inline-block;
  }

  .jspsych-btn.rsrch-btn,
  .rsrch-btn {
    font-size: 17px;
    padding: 14px 26px;
    margin: 24px 6px 0;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    min-height: 52px;
  }
  .rsrch-btn-go {
    background: var(--go-deep);
    border-color: var(--go-deep);
    color: #fff;
    font-weight: 600;
  }

  .video-wrap {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    position: relative;
    z-index: 1;
  }
  .video-wrap.pre-play video { opacity: 0; }

  .play-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 220px;
    height: 220px;
    padding-left: 12px;
    border: none;
    border-radius: 50%;
    background: var(--go);
    box-shadow: 0 10px 0 var(--go-deep), 0 18px 44px var(--go-glow);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 12;
  }
  .play-btn:active {
    transform: translate(-50%, -50%) translateY(6px);
    box-shadow: 0 4px 0 var(--go-deep), 0 10px 24px var(--go-glow);
  }

  .tap-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.85);
    color: #fff;
    font-size: 30px;
    z-index: 13;
  }

  .hidden { display: none !important; }

  .go-btn {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    min-width: 340px;
    min-height: 150px;
    padding: 0 56px;
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: #fff;
    background: var(--go);
    border: none;
    border-radius: 999px;
    box-shadow: 0 10px 0 var(--go-deep), 0 18px 40px var(--go-glow);
    z-index: 14;
  }
  .go-btn:active {
    transform: translate(-50%, -50%) translateY(6px);
    box-shadow: 0 4px 0 var(--go-deep), 0 10px 24px var(--go-glow);
  }
  .go-btn.pop { animation: pop 420ms cubic-bezier(.2, 1.5, .4, 1) both; }

  .go-btn-small {
    position: static;
    transform: none;
    min-width: 200px;
    min-height: 90px;
    font-size: 28px;
    margin-top: 28px;
  }
  .go-btn-small:active { transform: translateY(4px); }

  @keyframes pop {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .go-btn.pop { animation: none; }
  }

  .label-plate {
    font-size: 40px;
    font-weight: 650;
    margin: 24px 0;
  }

  .stim {
    width: 240px;
    height: 240px;
    object-fit: contain;
    display: inline-block;
    vertical-align: middle;
  }
  .stim-missing {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 2px dashed var(--line);
    border-radius: 14px;
    color: var(--muted);
    font-size: 13px;
    padding: 8px;
    text-align: center;
    word-break: break-all;
  }

  .target-row .stim { width: 300px; height: 300px; }

  .choice-btn {
    background: var(--white);
    border: 3px solid var(--line);
    border-radius: 22px;
    padding: 18px;
    margin: 0 20px;
  }
  .choice-btn:active { border-color: var(--go); }

  .sort-row { display: flex; gap: 28px; justify-content: center; }

  .fatal {
    background: var(--white);
    color: var(--ink);
    min-height: 100%;
    padding: 12vh 8vw;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  .fatal-msg {
    font-size: 19px;
    line-height: 1.5;
    border-left: 3px solid #ef4444;
    padding-left: 16px;
    margin: 18px 0;
  }

  </style>
</head>
<body>
  <script src="experiment.js"></script>
</body>
</html>
